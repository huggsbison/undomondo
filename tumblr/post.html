    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #F2EFE5;
        color: #111;
        line-height: 1.6;
    }

    /* Nav - minimal, no logo */
    nav {
        background: #111;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Space Mono', monospace;
        border-bottom: 3px solid #D62828;
    }

    nav a.brand {
        font-family: 'Syne', sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: #F2EFE5;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.15em;
    }

    nav a.brand:hover { color: #D62828; }

    .nav-links {
        display: flex;
        gap: 1.5rem;
        list-style: none;
    }

    .nav-links a {
        text-decoration: none;
        color: #F2EFE5;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transition: color 0.2s;
        opacity: 0.7;
    }

    .nav-links a:hover, .nav-links a.active {
        color: #D62828;
        opacity: 1;
    }

    /* Hero - Transmissions style */
    .hero {
        background-color: #111111;
        background-image: radial-gradient(circle, #005F99 8px, transparent 8px);
        background-size: 24px 24px;
        padding: 5rem 2rem 4rem;
        position: relative;
        overflow: hidden;
    }

    .hero-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .hero-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 2rem;
    }

    .hero-title-block {
        position: relative;
    }

    .hero-title {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: clamp(4rem, 10vw, 8rem);
        line-height: 0.85;
        color: #F2EFE5;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
    }

    .hero-title-shadow {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: clamp(4rem, 10vw, 8rem);
        line-height: 0.85;
        text-transform: uppercase;
        color: transparent;
        -webkit-text-stroke: 2px #005F99;
        position: absolute;
        top: 4px;
        left: 4px;
        z-index: 0;
        opacity: 0.3;
    }

    .hero-right {
        text-align: right;
        padding-bottom: 1rem;
    }

    .hero-right .tagline {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: clamp(1.2rem, 2.5vw, 1.8rem);
        color: rgba(242,239,229,0.9);
        text-transform: uppercase;
        line-height: 1.3;
    }

    .hero-right .tagline .red { color: #D62828; }

    .hero-right .meta {
        font-family: 'Space Mono', monospace;
        font-size: 0.65rem;
        color: rgba(242,239,229,0.4);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-top: 0.75rem;
    }

    .hero-stats {
        display: flex;
        gap: 3rem;
        margin-top: 1rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(242,239,229,0.15);
    }

    .stat {
        text-align: center;
    }

    .stat-number {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: 2rem;
        color: #FFB703;
    }

    .stat-label {
        font-family: 'Space Mono', monospace;
        font-size: 0.7rem;
        color: rgba(242,239,229,0.5);
        text-transform: uppercase;
        letter-spacing: 0.15em;
    }

    /* Container */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }

    /* Era sections */
    .era-section {
        margin: 2.5rem 0;

    .era-header {

    .era-title {

        text-transform: uppercase;

    }

    .era-meta {

        font-size: 0.8rem;
        color: rgba(242,239,229,0.5);
        margin-top: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    .year-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        padding: 1rem 2.5rem 2rem;
    }

    .year-link {
        padding: 0.6rem 1.2rem;
        background: transparent;
        border: 2px solid rgba(242,239,229,0.3);
        text-decoration: none;
        color: #F2EFE5;
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 0.85rem;
        transition: all 0.2s;
    }

    .year-link:hover {
        background: #D62828;
        border-color: #D62828;
        color: #F2EFE5;
    }

    .year-link .count {
        opacity: 0.5;
        font-weight: 400;
        font-size: 0.75rem;
    }

    /* Tags section */
    .tags-section {
        margin: 2.5rem 0;
        background: #111;
        border-left: 4px solid #005F99;
        padding: 2rem 2.5rem;
    }

    .tags-title {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: 1.3rem;
        color: #F2EFE5;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
    }

    .tags-subtitle {
        font-family: 'Space Mono', monospace;
        font-size: 0.75rem;
        color: rgba(242,239,229,0.4);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 1.5rem;
    }

    .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
    }

    .pill {
        display: inline-block;
        padding: 0.4rem 0.9rem;
        background: transparent;
        border: 1px solid rgba(242,239,229,0.2);
        border-radius: 20px;
        font-family: 'Space Mono', monospace;
        font-size: 0.75rem;
        text-decoration: none;
        color: rgba(242,239,229,0.7);
        transition: all 0.2s;
    }

    .pill:hover {
        background: #005F99;
        color: #F2EFE5;
        border-color: #005F99;
    }

    /* CTA bar */
    .cta-bar {
        background: #D62828;
        padding: 1.5rem 2.5rem;
        margin: 2.5rem 0;
    }

    .cta-bar a {
        display: block;
        text-align: center;
        font-family: 'Space Mono', monospace;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        color: #F2EFE5;
        text-decoration: none;
        transition: opacity 0.2s;
    }

    .cta-bar a:hover { opacity: 0.8; }

    /* Footer */
    footer {
        background: #D62828;
        color: #F2EFE5;
        padding: 48px 40px;
    }
    footer a { color: #F2EFE5; text-decoration: none; }
    footer a:hover { opacity: 0.8; background: #F2EFE5; color: #D62828; }

    @media (max-width: 768px) {
        nav { flex-direction: column; gap: 0.75rem; }
        .nav-links { gap: 1rem; flex-wrap: wrap; justify-content: center; }
        .hero { padding: 3rem 1.5rem 2.5rem; }
        .hero-top { flex-direction: column; }
        .hero-right { text-align: left; }
        .hero-stats { gap: 1.5rem; flex-wrap: wrap; }
        .year-links { padding: 1rem 1.5rem 1.5rem; }
        .era-header { padding: 1.5rem; }
        .tags-section { padding: 1.5rem; }
    }
    </style>
</head>

    <script>
    // Load posts.json and render the post
    async function loadPost() {
        try {
            const response = await fetch('/tumblr/posts.json');
            const posts = await response.json();
            
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');
            
            const post = posts.find(p => p.id === postId);
            if (!post) {
                document.getElementById('post-container').innerHTML = '<div class="error">Post not found.</div>';
                return;
            }
            
            // Find current year for navigation
            const year = post.year;
            const yearPosts = posts.filter(p => p.year === year).sort((a, b) => new Date(b.date) - new Date(a.date));
            const currentIndex = yearPosts.findIndex(p => p.id === postId);
            const prevPost = currentIndex > 0 ? yearPosts[currentIndex - 1] : null;
            const nextPost = currentIndex < yearPosts.length - 1 ? yearPosts[currentIndex + 1] : null;
            
            const formatDate = (dateStr) => {
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            };
            
            const tagsHtml = (post.tags || []).map(t => `<span class="tag">${escape(t)}</span>`).join('');
            
            let navHtml = '<div class="post-nav"><div style="flex:1;">';
            if (prevPost) {
                navHtml += `<a href="/tumblr/post.html?id=${prevPost.id}">← Previous</a>`;
            }
            navHtml += '</div><div class="nav-center">';
            navHtml += `<a href="/tumblr/${year}.html">← Back to ${year}</a>`;
            navHtml += '</div><div style="flex:1; text-align: right;">';
            if (nextPost) {
                navHtml += `<a href="/tumblr/post.html?id=${nextPost.id}">Next →</a>`;
            }
            navHtml += '</div></div>';
            
            const container = document.getElementById('post-container');
            container.innerHTML = `
                <div class="post-header">
                    <div class="post-meta">${formatDate(post.date)} · ${year}</div>
                    <h1 class="post-title">${escape(post.title || 'Untitled')}</h1>
                </div>
                <div class="post-content">${post.content || ''}</div>
                ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
                ${navHtml}
            `;
        } catch (error) {
            console.error('Error loading post:', error);
            document.getElementById('post-container').innerHTML = '<div class="error">Error loading post. <a href="/archive/">Back to Archive</a></div>';
        }
    }
    
    function escape(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    loadPost();
    </script>
