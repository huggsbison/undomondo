<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archive — Undomondo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=Dela+Gothic+One&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #F2EFE5;
        color: #111;
        line-height: 1.6;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
    }

    .post-header {
        margin-bottom: 2rem;
        padding-bottom: 2rem;
        border-bottom: 2px solid #D62828;
    }

    .post-meta {
        font-family: 'Space Mono', monospace;
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 1rem;
    }

    .post-title {
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        font-weight: 700;
        color: #111;
        margin-bottom: 1rem;
        line-height: 1.2;
    }

    .post-content {
        font-size: 1.05rem;
        line-height: 1.8;
        color: #333;
    }

    .post-content h2 {
        margin-top: 2rem;
        margin-bottom: 1rem;
        font-size: 1.5rem;
        color: #111;
    }

    .post-content h3 {
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        font-size: 1.2rem;
        color: #111;
    }

    .post-content p {
        margin-bottom: 1rem;
    }

    .post-content a {
        color: #005F99;
        text-decoration: underline;
    }

    .post-content a:hover {
        color: #D62828;
    }

    .post-content ul, .post-content ol {
        margin-left: 2rem;
        margin-bottom: 1rem;
    }

    .post-content li {
        margin-bottom: 0.5rem;
    }

    .post-content img {
        max-width: 100%;
        height: auto;
        margin: 1.5rem 0;
        border-radius: 4px;
    }

    .post-content iframe {
        max-width: 100%;
        margin: 1.5rem 0;
    }

    .post-tags {
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 2px solid #eee;
    }

    .tag {
        display: inline-block;
        padding: 0.5rem 1rem;
        background: #f0f0f0;
        border-radius: 20px;
        font-size: 0.85rem;
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
        color: #666;
    }

    .post-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 3rem;
        padding-top: 2rem;
        border-top: 2px solid #eee;
    }

    .post-nav a {
        text-decoration: none;
        color: #005F99;
        font-weight: 600;
        transition: color 0.2s;
    }

    .post-nav a:hover {
        color: #D62828;
    }

    .post-nav .nav-center {
        text-align: center;
    }

    .error {
        text-align: center;
        padding: 4rem 2rem;
        color: #d62828;
    }

    footer {
        background: #D62828;
        color: #F2EFE5;
        padding: 48px 40px;
    }
    footer a { color: #F2EFE5; text-decoration: none; }
    footer a:hover { opacity: 0.8; background: #F2EFE5; color: #D62828; }

    @media (max-width: 768px) {
        .container { padding: 1.5rem 1rem; }
        .post-nav { flex-direction: column; gap: 1rem; text-align: center; }
    }
    </style>
</head>

    <script>
    async function loadPost() {
        try {
            const response = await fetch('/tumblr/posts.json');
            const posts = await response.json();

            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');

            const post = posts.find(p => String(p.id) === String(postId));
            if (!post) {
                document.getElementById('post-container').innerHTML = '<div class="error">Post not found.</div>';
                return;
            }

            const year = String(post.year);
            const yearPosts = posts.filter(p => String(p.year) === year).sort((a, b) => new Date(b.date) - new Date(a.date));
            const currentIndex = yearPosts.findIndex(p => String(p.id) === String(postId));
            const prevPost = currentIndex > 0 ? yearPosts[currentIndex - 1] : null;
            const nextPost = currentIndex < yearPosts.length - 1 ? yearPosts[currentIndex + 1] : null;

            const formatDate = (dateStr) => {
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            };

            const tagsHtml = (post.tags || []).map(t => `<span class="tag">${escape(t)}</span>`).join('');

            let navHtml = '<div class="post-nav"><div style="flex:1;">';
            if (prevPost) {
                navHtml += `<a href="/tumblr/post.html?id=${prevPost.id}">← Previous</a>`;
            }
            navHtml += '</div><div class="nav-center">';
            navHtml += `<a href="/tumblr/${year}.html">← Back to ${year}</a>`;
            navHtml += '</div><div style="flex:1; text-align: right;">';
            if (nextPost) {
                navHtml += `<a href="/tumblr/post.html?id=${nextPost.id}">Next →</a>`;
            }
            navHtml += '</div></div>';

            const container = document.getElementById('post-container');
            container.innerHTML = `
                <div class="post-header">
                    <div class="post-meta">${formatDate(post.date)} · ${year}</div>
                    <h1 class="post-title">${escape(post.title || 'Untitled')}</h1>
                </div>
                <div class="post-content">${post.content || ''}</div>
                ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
                ${navHtml}
            `;
        } catch (error) {
            console.error('Error loading post:', error);
            document.getElementById('post-container').innerHTML = '<div class="error">Error loading post. <a href="/archive/">Back to Archive</a></div>';
        }
    }

    function escape(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    loadPost();
    </script>
</body>
</html>
