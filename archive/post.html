<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>undomondo — redirecting</title>
<style>
body { font-family: 'Space Mono', monospace; background: #F2EFE5; color: #111; display: flex; align-items: center; justify-content: center; min-height: 90vh; }
a { color: #005F99; }
</style>
</head>
<body>
<p id="msg">Redirecting&hellip;</p>
<script>
(async function () {
    var fallback = function () {
        document.getElementById('msg').innerHTML =
            'Post not found. <a href="/archive/">Back to the Archive</a>';
    };
    try {
        var id = new URLSearchParams(window.location.search).get('id');
        if (!id) return fallback();
        var res = await fetch('/archive/urlmap.json');
        var map = await res.json();
        var target = map[String(id)];
        if (target) {
            location.replace(target);
        } else {
            fallback();
        }
    } catch (e) {
        fallback();
    }
})();
</script>
<noscript><a href="/archive/">Back to the Archive</a></noscript>
</body>
</html>
