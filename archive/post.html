<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Post | Undomondo Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D42B2B;
    --dark: #1a1a1a;
    --cream: #F2EFE5;
    --paper: #F2EFE9;
    --blue: #005F99;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); }

  /* NAV */
  .top-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px; background: white; border-bottom: 3px solid var(--red);
  }
  .top-nav .wordmark {
    font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700;
    color: var(--dark); text-decoration: none;
  }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    font-family: 'Space Grotesk', sans-serif; font-size: 13px;
    text-transform: uppercase; letter-spacing: 2px; text-decoration: none;
    color: var(--dark); transition: all 0.2s;
  }
  .nav-links a:hover { color: var(--red); }

  /* POST */
  .post-container {
    max-width: 800px; margin: 60px auto; padding: 0 40px;
  }
  .breadcrumb {
    font-family: 'Space Mono', monospace; font-size: 11px;
    letter-spacing: 1px; color: #999; margin-bottom: 40px;
  }
  .breadcrumb a { color: var(--blue); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }

  .post-header {
    margin-bottom: 40px; padding-bottom: 30px;
    border-bottom: 1px solid #ddd;
  }
  .post-date {
    font-family: 'Space Mono', monospace; font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--blue);
    margin-bottom: 16px;
  }
  .post-title {
    font-family: 'Space Grotesk', sans-serif; font-size: 48px;
    font-weight: 700; line-height: 1.1; margin-bottom: 20px;
  }
  .post-tags {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .post-tag {
    font-family: 'Space Mono', monospace; font-size: 10px;
    padding: 6px 12px; background: var(--dark); color: var(--cream);
    border-radius: 3px; text-decoration: none; text-transform: lowercase;
  }
  .post-tag:hover { background: var(--red); }

  .post-content {
    font-size: 17px; line-height: 1.8; color: #333;
  }
  .post-content p { margin-bottom: 24px; }
  .post-content a {
    color: var(--blue); text-decoration: none;
    border-bottom: 1px solid var(--blue);
  }
  .post-content a:hover { color: var(--red); border-bottom-color: var(--red); }
  .post-content strong { font-weight: 600; color: var(--dark); }
  .post-content img { max-width: 100%; height: auto; margin: 30px 0; border-radius: 4px; }
  .post-content small { display: block; font-size: 13px; color: #999; margin-top: -20px; margin-bottom: 20px; }

  /* Embedded content (videos, etc.) - hide broken ones */
  .post-content embed, .post-content object { display: none; }

  /* Back link */
  .back-link {
    margin-top: 60px; padding-top: 30px; border-top: 1px solid #ddd;
  }
  .back-link a {
    font-family: 'Space Grotesk', sans-serif; font-size: 14px;
    text-transform: uppercase; letter-spacing: 2px;
    color: var(--dark); text-decoration: none;
    transition: color 0.2s;
  }
  .back-link a:hover { color: var(--red); }

  .loading {
    text-align: center; padding: 100px 40px;
    font-family: 'Space Mono', monospace; color: #999;
  }

  @media (max-width: 768px) {
    .top-nav { flex-direction: column; gap: 20px; padding: 20px; }
    .post-container { padding: 0 20px; margin: 40px auto; }
    .post-title { font-size: 32px; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav class="top-nav">
  <a href="/" class="wordmark">UNDOMONDO</a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/archive">Archive</a>
    <a href="/#newsletter">Newsletter</a>
  </div>
</nav>

<!-- POST -->
<div class="post-container">
  <div class="loading">Loading post...</div>
  <div id="post-output" style="display: none;">
    <div class="breadcrumb">
      <a href="/">Home</a> / <a href="/archive">Archive</a> / <span id="breadcrumb-year"></span> / <span id="breadcrumb-title"></span>
    </div>

    <div class="post-header">
      <div class="post-date" id="post-date"></div>
      <h1 class="post-title" id="post-title"></h1>
      <div class="post-tags" id="post-tags"></div>
    </div>

    <div class="post-content" id="post-content"></div>

    <div class="back-link">
      <a href="/archive">← Back to Archive</a>
    </div>
  </div>
</div>

<script>
// Get slug from URL
const params = new URLSearchParams(window.location.search);
const slug = params.get('slug');

if (!slug) {
  document.querySelector('.loading').innerHTML = 'Post not found. <a href="/archive">Return to archive</a>';
} else {
  // Load posts and find the one we need
  fetch('/archive/posts.json')
    .then(res => res.json())
    .then(posts => {
      const post = posts.find(p => p.slug === slug);

      if (!post) {
        document.querySelector('.loading').innerHTML = 'Post not found. <a href="/archive">Return to archive</a>';
        return;
      }

      // Update page
      document.getElementById('page-title').textContent = `${post.title} | Undomondo Archive`;
      document.getElementById('breadcrumb-year').textContent = post.year;
      document.getElementById('breadcrumb-title').textContent = post.title;
      document.getElementById('post-date').textContent = post.date.split(' ')[0];
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-content').innerHTML = post.content;

      // Tags
      if (post.tags && post.tags.length > 0) {
        document.getElementById('post-tags').innerHTML = post.tags
          .map(tag => `<a href="/archive?tag=${tag}" class="post-tag">#${tag}</a>`)
          .join('');
      }

      // Show post, hide loading
      document.querySelector('.loading').style.display = 'none';
      document.getElementById('post-output').style.display = 'block';
    })
    .catch(err => {
      document.querySelector('.loading').innerHTML = 'Error loading post. <a href="/archive">Return to archive</a>';
      console.error(err);
    });
}
</script>

</body>
</html>
