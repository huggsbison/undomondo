<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCKUP — Archive header restructure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Fugaz+One&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #F2EFE5;
        background-image: radial-gradient(circle, #1A1A1A 1.5px, transparent 1.5px);
        background-size: 24px 24px;
        background-attachment: fixed;
        color: #111;
        line-height: 1.6;
    }
    body::before {
        content: '';
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(242, 239, 229, 0.92);
        z-index: 0; pointer-events: none;
    }
    body > * { position: relative; z-index: 1; }

    /* ---- MOCKUP banner ---- */
    .mockup-note {
        background: #FFB703;
        color: #111;
        font-family: 'Space Mono', monospace;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        padding: 0.6rem 1rem;
        text-align: center;
        border-bottom: 2px solid #111;
    }

    /* Hero */
    .hero {
        background-color: transparent;
        padding: 5rem 2rem 3rem;
        position: relative;
        overflow: hidden;
    }

    .hero-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 2rem;
    }

    /* Row 1 — big title */
    .hero-title-block {
        position: relative;
        width: max-content;
        max-width: 100%;
    }

    .hero-title {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: clamp(4rem, 10vw, 8rem);
        line-height: 0.85;
        color: #111111;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
    }

    .hero-title-shadow {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: clamp(4rem, 10vw, 8rem);
        line-height: 0.85;
        text-transform: uppercase;
        color: transparent;
        -webkit-text-stroke: 2px #005F99;
        position: absolute;
        top: 4px;
        left: 4px;
        z-index: 0;
        opacity: 0.3;
    }

    /* Row 2 — stamp logo */
    .hero-brand-logo {
        display: block;
        width: clamp(90px, 11vw, 140px);
        height: auto;
    }

    /* Row 3 — red divider + tagline section */
    .hero-divider {
        width: 100%;
        height: 3px;
        background: #D62828;
        margin: 0.25rem 0 0.25rem;
    }

    .hero-tagline-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 1.25rem;
    }

    .hero-tagline-row .tagline {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: clamp(1.1rem, 2vw, 1.55rem);
        color: #111111;
        text-transform: uppercase;
        line-height: 1.3;
    }

    .hero-tagline-row .tagline .red { color: #D62828; }

    .hero-tagline-row .meta {
        font-family: 'Space Mono', monospace;
        font-size: 0.7rem;
        color: rgba(17,17,17,0.55);
        text-transform: uppercase;
        letter-spacing: 0.22em;
    }

    /* Row 4 — full-bleed stats band */
    .hero-stats {
        display: flex;
        gap: 3rem;
        justify-content: center;
        align-items: center;
        padding: 1.75rem 2rem;
        background-color: #111;
        background-image: radial-gradient(circle, #005F99 2px, transparent 2px);
        background-size: 18px 18px;
        border-top: 3px solid #D62828;
        border-bottom: 3px solid #D62828;
        width: 100vw;
        margin-left: calc(50% - 50vw);
        margin-right: calc(50% - 50vw);
        margin-top: 1.5rem;
    }

    .stat { text-align: center; }

    .stat-number {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: 2rem;
        color: #FFB703;
    }

    .stat-label {
        font-family: 'Space Mono', monospace;
        font-size: 0.7rem;
        color: rgba(242,239,229,0.7);
        text-transform: uppercase;
        letter-spacing: 0.15em;
    }

    /* Container */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }

    /* Era sections — unchanged from live */
    .era-section {
        margin: 2.5rem 0;
        background: #111;
        border-left: 4px solid #D62828;
        overflow: hidden;
    }
    .era-header { padding: 2rem 2.5rem 1rem; }
    .era-title {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: 1.6rem;
        color: #F2EFE5;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .era-meta {
        font-family: 'Space Mono', monospace;
        font-size: 0.8rem;
        color: rgba(242,239,229,0.5);
        margin-top: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }
    .year-links {
        display: flex; flex-wrap: wrap; gap: 0.75rem;
        padding: 1rem 2.5rem 2rem;
    }
    .year-link {
        padding: 0.6rem 1.2rem;
        background: transparent;
        border: 2px solid rgba(242,239,229,0.3);
        text-decoration: none;
        color: #F2EFE5;
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 0.85rem;
        transition: all 0.2s;
    }
    .year-link:hover { background: #D62828; border-color: #D62828; color: #F2EFE5; }
    .year-link .count { opacity: 0.5; font-weight: 400; font-size: 0.75rem; }

    @media (max-width: 768px) {
        .hero-tagline-row { flex-direction: column; align-items: flex-start; }
        .hero-stats { gap: 1.5rem; flex-wrap: wrap; }
        .year-links { padding: 1rem 1.5rem 1.5rem; }
        .era-header { padding: 1.5rem; }
    }
    </style>
</head>
<body>
<div class="mockup-note">MOCKUP — archive hero, vertical stack. Not live.</div>

<div class="hero">
    <div class="hero-inner">
        <!-- Row 1: Title -->
        <div class="hero-title-block">
            <h1 class="hero-title">The<br>Archive</h1>
            <div class="hero-title-shadow" aria-hidden="true">The<br>Archive</div>
        </div>

        <!-- Row 2: Stamp logo -->
        <img src="../assets/undomondo-stamp.png" alt="undomondo" class="hero-brand-logo">

        <!-- Row 3: Divider + tagline row -->
        <div>
            <div class="hero-divider"></div>
            <div class="hero-tagline-row" style="padding-top: 0.9rem;">
                <p class="tagline">Music Blog <span class="red">&amp; Radio</span> Show</p>
                <p class="meta">Est. 2005 · Istanbul / Barcelona / Internet</p>
            </div>
        </div>
    </div>

    <!-- Row 4: Full-bleed stats band -->
    <div class="hero-stats">
        <div class="stat"><div class="stat-number">4,769</div><div class="stat-label">Posts</div></div>
        <div class="stat"><div class="stat-number">17</div><div class="stat-label">Years</div></div>
        <div class="stat"><div class="stat-number">2005</div><div class="stat-label">Started</div></div>
        <div class="stat"><div class="stat-number">639</div><div class="stat-label">Tags</div></div>
    </div>
</div>

<!-- ghost of the body below, just to show scale -->
<div class="container">
    <div class="era-section">
        <div class="era-header">
            <h2 class="era-title">WordPress Era</h2>
            <p class="era-meta">646 posts · 2005–2008 · The blog's origins</p>
        </div>
        <div class="year-links">
            <a href="#" class="year-link">2005 <span class="count">(103)</span></a>
            <a href="#" class="year-link">2006 <span class="count">(214)</span></a>
            <a href="#" class="year-link">2007 <span class="count">(233)</span></a>
            <a href="#" class="year-link">2008 <span class="count">(96)</span></a>
        </div>
    </div>
</div>

</body>
</html>
